name: Verify HTTP video ranges
on:
  push:
    paths: [README.md]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live MP4 byte ranges
        run: |
          set -e
          URL="https://zulkar.atanvir971-95a.workers.dev/assets/video/live-music-moments.mp4"
          curl -sS --fail --max-time 45 -D /tmp/range-headers -H "Range: bytes=0-1023" -o /tmp/first-kb "$URL"
          head -35 /tmp/range-headers
          test "$(stat -c %s /tmp/first-kb)" -eq 1024
          grep -qi 'HTTP/2 206' /tmp/range-headers
          grep -qi 'content-range: bytes 0-1023/12179606' /tmp/range-headers
          echo "Verified: live worker serves playable HTTP 206 byte ranges"
