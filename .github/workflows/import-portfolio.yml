name: Import Zulkar portfolio assets
on:
  workflow_dispatch:
  push:
    paths:
      - README.md

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified website archive
        run: |
          python -m pip install --quiet gdown
          gdown --id 1g_9yFp428FxB9LcASam7cv6B1Vb4g8r4 -O site.zip
          echo "b69fc53ca6d70bfca32fc1aef3f221e553d58ffc75241935351a6426f322fdae  site.zip" | sha256sum -c -
      - name: Extract and validate website
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('site.zip') as archive:
              assert archive.testzip() is None
              archive.extractall('.')
          assert Path('index.html').exists()
          assert Path('assets/video/live-music-moments.mp4').exists()
          assert Path('assets/img/poster-live-music.webp').exists()
          print('All website files extracted and verified')
          PY
          rm site.zip
      - name: Commit website source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already up to date"
          else
            git commit -m "Publish latest Zulkar portfolio including fifth video"
            git push origin HEAD:main
          fi
