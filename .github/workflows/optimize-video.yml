name: Publish optimized Zulkar video
on:
  workflow_dispatch:
  push:
    paths: [README.md]
permissions:
  contents: write
jobs:
  update-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified optimized media
        run: |
          python -m pip install --quiet gdown
          gdown 1znSWgWOtK4nYc8E21Z8Xo-QQlOPxMx7D -O site.zip
          echo "4c77931170b6ea7d7693ec91b2c84b980c533fb7fb026344605e4b641a6b2474  site.zip" | sha256sum -c -
          unzip -p site.zip assets/video/live-music-moments.mp4 > assets/video/live-music-moments.mp4
          test "$(stat -c %s assets/video/live-music-moments.mp4)" -eq 12179606
          rm site.zip
      - name: Commit optimized browser-compatible MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/live-music-moments.mp4
          git commit -m "Optimize fifth video for browser playback"
          git push origin HEAD:main
